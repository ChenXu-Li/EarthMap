<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地球卫星轨迹 · Earth 3D</title>
<style>
  :root {
    --bg: #05060a;
    --panel: rgba(13, 18, 30, 0.58);
    --panel-border: rgba(120, 170, 255, 0.2);
    --text: #eaf0ff;
    --text-dim: #9aabd0;
    --accent: #4ea1ff;
    --accent-soft: rgba(78, 161, 255, 0.15);
    --gps: #5ec8ff;
    --starlink: #f6c75e;
    --beidou: #69e49a;
    --qianfan: #8f6bff;
    --apt: #ff7bba;
    --jilin: #56d985;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
  }

  #scene {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  #loader {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: radial-gradient(circle at 50% 40%, #0b1426 0%, var(--bg) 70%);
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  #loader.hide { opacity: 0; visibility: hidden; pointer-events: none; }

  .spinner {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 3px solid rgba(78, 161, 255, 0.2);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #loader p {
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 2px;
  }

  .panel {
    position: absolute;
    z-index: 20;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-radius: 8px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
  }

  #info-panel {
    top: calc(clamp(10px, 3vh, 24px) + 56px);
    left: clamp(10px, 3vw, 20px);
    padding: clamp(10px, 2.4vh, 16px) clamp(12px, 2.8vw, 18px);
    width: clamp(210px, 38%, 330px);
    max-width: calc(100% - 220px);
    max-height: calc(100% - 24px);
    overflow-y: auto;
    overscroll-behavior: contain;
    transition: opacity 0.22s ease, visibility 0.22s ease, transform 0.22s ease;
  }
  #info-panel.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(-8px);
  }
  #info-panel.collapsed {
    width: auto;
    min-width: 156px;
    padding: 12px 14px;
  }
  #info-panel.collapsed .info-body,
  #info-panel.collapsed .info-tabs {
    display: none;
  }
  .info-head {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .info-head h1 {
    min-width: 0;
    flex: 1;
    font-size: clamp(15px, 2.6vw, 20px);
    font-weight: 600;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .info-head h1 .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    color: var(--accent);
    flex: 0 0 auto;
  }
  #info-panel[data-current="gps"] .dot { background: var(--gps); color: var(--gps); box-shadow: 0 0 12px var(--gps); }
  #info-panel[data-current="starlink"] .dot { background: var(--starlink); color: var(--starlink); box-shadow: 0 0 12px var(--starlink); }
  #info-panel[data-current="beidou"] .dot { background: var(--beidou); color: var(--beidou); box-shadow: 0 0 12px var(--beidou); }
  #info-panel[data-current="qianfan"] .dot { background: var(--qianfan); color: var(--qianfan); box-shadow: 0 0 12px var(--qianfan); }
  #info-panel[data-current="apt"] .dot { background: var(--apt); color: var(--apt); box-shadow: 0 0 12px var(--apt); }
  #info-panel[data-current="jilin"] .dot { background: var(--jilin); color: var(--jilin); box-shadow: 0 0 12px var(--jilin); }
  .collapse-btn {
    width: 28px;
    height: 28px;
    border: 1px solid rgba(120, 170, 255, 0.24);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    font-size: 16px;
    line-height: 1;
    transition: all 0.2s ease;
  }
  .collapse-btn:hover {
    background: var(--accent-soft);
    border-color: rgba(78, 161, 255, 0.42);
  }
  .info-body {
    margin-top: 5px;
    color: var(--text-dim);
    font-size: clamp(11px, 1.8vw, 12.5px);
    line-height: 1.5;
  }
  .info-meta {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .info-meta div {
    min-width: 0;
    padding: 6px 7px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .info-meta span {
    display: block;
    color: var(--text-dim);
    font-size: 10px;
    line-height: 1.2;
  }
  .info-meta strong {
    display: block;
    margin-top: 3px;
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .info-tabs {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(2, auto);
    gap: 7px;
    margin-top: 10px;
  }
  .info-tab {
    min-height: 34px;
    border: 1px solid rgba(120, 170, 255, 0.18);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-dim);
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
  }
  .info-tab.active {
    color: var(--text);
    background: var(--accent-soft);
    border-color: rgba(78, 161, 255, 0.4);
  }

  #toggle-panel {
    top: clamp(10px, 3vh, 24px);
    right: clamp(10px, 3vw, 24px);
    bottom: clamp(10px, 3vh, 24px);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 178px;
    max-height: calc(100% - 20px);
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    touch-action: none;
    pointer-events: auto;
    z-index: 30;
    scrollbar-width: none;
  }
  #toggle-panel::-webkit-scrollbar { display: none; }
  .panel-title {
    padding: 3px 6px 5px;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 1px;
  }
  .divider {
    height: 1px;
    margin: 2px 4px;
    background: rgba(255, 255, 255, 0.1);
  }
  .toggle-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    min-height: 36px;
    padding: 9px 12px;
    font-size: 12.5px;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }
  .toggle-btn:hover {
    background: var(--accent-soft);
    color: var(--text);
  }
  .toggle-btn.on {
    background: var(--accent-soft);
    border-color: rgba(78, 161, 255, 0.4);
    color: var(--text);
  }
  .toggle-btn .label {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px currentColor;
    color: var(--accent);
    flex: 0 0 auto;
  }
  .legend-dot.gps { background: var(--gps); color: var(--gps); }
  .legend-dot.starlink { background: var(--starlink); color: var(--starlink); }
  .legend-dot.beidou { background: var(--beidou); color: var(--beidou); }
  .legend-dot.qianfan { background: var(--qianfan); color: var(--qianfan); }
  .legend-dot.apt { background: var(--apt); color: var(--apt); }
  .legend-dot.jilin { background: var(--jilin); color: var(--jilin); }
  .toggle-btn .switch {
    width: 26px;
    height: 14px;
    border-radius: 8px;
    background: rgba(255,255,255,0.12);
    position: relative;
    transition: background 0.2s ease;
    flex: 0 0 auto;
  }
  .toggle-btn .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #cdd6ee;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .toggle-btn.on .switch { background: var(--accent); }
  .toggle-btn.on .switch::after { transform: translateX(12px); background: #fff; }

  #stat {
    position: absolute;
    bottom: 24px;
    right: 24px;
    z-index: 20;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    text-align: right;
    line-height: 1.7;
  }
  #stat .accent { color: var(--accent); }

  @media (max-width: 640px) {
    #info-panel {
      width: min(280px, calc(100% - 174px));
      min-width: 190px;
      padding: 10px 12px;
    }
    .info-head { gap: 8px; }
    .info-head h1 { font-size: 15px; }
    .info-meta { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .info-tabs { gap: 5px; }
    #toggle-panel { width: 146px; padding: 8px; gap: 6px; }
    .toggle-btn { font-size: 11.5px; padding: 8px 10px; }
    #stat { display: none; }
  }

  /* Shared back button (keeps consistent style across maps) */
  .back-btn{
    display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;
    background:rgba(0,0,0,0.48);color:var(--text);text-decoration:none;font-weight:600;
    font-size:14px;border:1px solid rgba(255,255,255,0.06);box-shadow:0 6px 18px rgba(0,0,0,0.45);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:40;cursor:pointer;
  }
  .back-btn:active{transform:translateY(1px)}
  .back-btn--fixed{position:fixed;left:clamp(10px,3vw,20px);top:calc(env(safe-area-inset-top,12px) + 12px)}
  .back-btn--header{position:relative;margin-right:8px}
  @media (max-width:640px){
    .back-btn{padding:8px 10px;font-size:13px;border-radius:10px}
    .back-btn--fixed{left:10px;top:calc(env(safe-area-inset-top,8px) + 8px)}
  }

  /* Prevent overlap: on larger screens push info panel right when back button is present */
  @media (min-width:880px) {
    #info-panel { left: clamp(10px, 3vw, 20px); }
  }
</style>
</head>
<body>
<div id="app">
  <a id="back-btn" class="back-btn back-btn--fixed" href="../MapPortal/index.html" aria-label="返回入口" onclick="handleBack(event)">← 返回</a>
  <canvas id="scene"></canvas>

  <div id="loader">
    <div class="spinner"></div>
    <p>正在加载三维地球</p>
  </div>

  <div id="info-panel" class="panel" data-current="overview">
    <div class="info-head">
      <h1><span class="dot"></span><span id="info-title">星座介绍</span></h1>
      <button id="info-collapse" class="collapse-btn" type="button" aria-label="收起信息卡" title="收起/展开">−</button>
    </div>
    <div class="info-body">
      <div id="info-desc">右侧只选择一个星座时，这里会显示它的轨道特征；取消全部选择时，保留当前介绍方便继续查看。</div>
      <div class="info-meta">
        <div><span>轨道高度</span><strong id="info-altitude">--</strong></div>
        <div><span>倾角</span><strong id="info-inclination">--</strong></div>
        <div><span>在轨数量</span><strong id="info-count">--</strong></div>
      </div>
    </div>
    <div class="info-tabs" aria-label="切换星座介绍">
      <button class="info-tab active" type="button" data-info="gps">GPS</button>
      <button class="info-tab" type="button" data-info="starlink">Starlink</button>
      <button class="info-tab" type="button" data-info="beidou">北斗</button>
      <button class="info-tab" type="button" data-info="qianfan">千帆</button>
      <button class="info-tab" type="button" data-info="apt">亚太</button>
      <button class="info-tab" type="button" data-info="jilin">吉林一号</button>
    </div>
  </div>

  <div id="toggle-panel" class="panel">
    <div class="panel-title">显示选项</div>
    <button class="toggle-btn on" data-toggle="autoRotate"><span class="label">自动自转</span><span class="switch"></span></button>
    <button class="toggle-btn on" data-toggle="clouds"><span class="label">云层</span><span class="switch"></span></button>
    <button class="toggle-btn on" data-toggle="atmosphere"><span class="label">大气辉光</span><span class="switch"></span></button>
    <button class="toggle-btn on" data-toggle="stars"><span class="label">星空</span><span class="switch"></span></button>
    <div class="divider"></div>
    <div class="panel-title">卫星星座</div>
    <button class="toggle-btn on" data-constellation="gps"><span class="label"><span class="legend-dot gps"></span>GPS</span><span class="switch"></span></button>
    <button class="toggle-btn on" data-constellation="starlink"><span class="label"><span class="legend-dot starlink"></span>Starlink</span><span class="switch"></span></button>
    <button class="toggle-btn on" data-constellation="beidou"><span class="label"><span class="legend-dot beidou"></span>北斗</span><span class="switch"></span></button>
    <button class="toggle-btn on" data-constellation="qianfan"><span class="label"><span class="legend-dot qianfan"></span>千帆星座</span><span class="switch"></span></button>
    <button class="toggle-btn on" data-constellation="apt"><span class="label"><span class="legend-dot apt"></span>亚太卫星</span><span class="switch"></span></button>
    <button class="toggle-btn on" data-constellation="jilin"><span class="label"><span class="legend-dot jilin"></span>吉林一号</span><span class="switch"></span></button>
  </div>

  <div id="stat">
    <div>视距 <span id="dist" class="accent">--</span></div>
    <div>卫星 <span id="sat-count" class="accent">--</span></div>
    <div>实时渲染 · WebGL</div>
  </div>

</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const app = document.getElementById('app');
    const canvas = document.getElementById('scene');
    const viewport = { width: window.innerWidth, height: window.innerHeight };
    const isTouchDevice = () => ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    const getLandscapeSize = () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      return isTouchDevice() && h > w
        ? { width: h, height: w, rotated: true }
        : { width: w, height: h, rotated: false };
    };

    function applyLandscapeLayout() {
      const size = getLandscapeSize();
      viewport.width = size.width;
      viewport.height = size.height;

      if (size.rotated) {
        app.style.position = 'fixed';
        app.style.top = '0';
        app.style.left = window.innerWidth + 'px';
        app.style.width = size.width + 'px';
        app.style.height = size.height + 'px';
        app.style.transformOrigin = 'top left';
        app.style.transform = 'rotate(90deg)';
      } else {
        app.style.position = '';
        app.style.top = '';
        app.style.left = '';
        app.style.width = '';
        app.style.height = '';
        app.style.transformOrigin = '';
        app.style.transform = '';
      }
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';
    }

    applyLandscapeLayout();
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(viewport.width, viewport.height);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.6;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05060a);

    const camera = new THREE.PerspectiveCamera(45, viewport.width / viewport.height, 0.1, 2000);
    camera.position.set(0, 0.6, 3.4);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.rotateSpeed = 0.6;
    controls.zoomSpeed = 0.8;
    controls.enablePan = false;
    controls.enableRotate = false;
    controls.minDistance = 1.6;
    controls.maxDistance = 8;
    controls.touches = {
      ONE: THREE.TOUCH.ROTATE,
      TWO: THREE.TOUCH.DOLLY_PAN
    };
    controls.target.set(0, 0, 0);
    controls.update();

    const rotationControl = {
      active: false,
      pointerId: null,
      lastX: 0,
      lastY: 0,
      sensitivity: 0.0045
    };

    function getLogicalPointerDelta(dx, dy) {
      if (typeof DOMMatrixReadOnly === 'undefined' || typeof DOMPoint === 'undefined') {
        return { dx, dy };
      }
      const transform = window.getComputedStyle(app).transform;
      if (!transform || transform === 'none') {
        return { dx, dy };
      }
      try {
        const inverse = new DOMMatrixReadOnly(transform).inverse();
        const point = inverse.transformPoint(new DOMPoint(dx, dy, 0, 0));
        return { dx: point.x, dy: point.y };
      } catch (error) {
        return { dx, dy };
      }
    }

    function handleDragRotation(dx, dy) {
      if (dx === 0 && dy === 0) return;
      const yaw = dx * rotationControl.sensitivity;
      const pitch = dy * rotationControl.sensitivity;

      const worldUp = new THREE.Vector3(0, 1, 0);
      const cameraDirection = new THREE.Vector3();
      camera.getWorldDirection(cameraDirection);
      const cameraRight = new THREE.Vector3();
      cameraRight.crossVectors(cameraDirection, camera.up).normalize();

      const deltaQuat = new THREE.Quaternion();
      const yawQuat = new THREE.Quaternion().setFromAxisAngle(worldUp, yaw);
      const pitchQuat = new THREE.Quaternion().setFromAxisAngle(cameraRight, pitch);
      deltaQuat.multiplyQuaternions(yawQuat, pitchQuat);

      earth.applyQuaternion(deltaQuat);
      clouds.applyQuaternion(deltaQuat);
      atmosphere.applyQuaternion(deltaQuat);
      satelliteRoot.applyQuaternion(deltaQuat);
    }

    canvas.addEventListener('pointerdown', (event) => {
      if (rotationControl.active || (event.pointerType === 'mouse' && event.button !== 0)) return;
      rotationControl.active = true;
      rotationControl.pointerId = event.pointerId;
      rotationControl.lastX = event.clientX;
      rotationControl.lastY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
      userInteracting = true;
    });

    canvas.addEventListener('pointermove', (event) => {
      if (!rotationControl.active || event.pointerId !== rotationControl.pointerId) return;
      const dx = event.clientX - rotationControl.lastX;
      const dy = event.clientY - rotationControl.lastY;
      const delta = getLogicalPointerDelta(dx, dy);
      handleDragRotation(delta.dx, delta.dy);
      rotationControl.lastX = event.clientX;
      rotationControl.lastY = event.clientY;
    });

    function endDrag(event) {
      if (!rotationControl.active || event.pointerId !== rotationControl.pointerId) return;
      rotationControl.active = false;
      rotationControl.pointerId = null;
      canvas.releasePointerCapture(event.pointerId);
      userInteracting = false;
    }

    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('pointerleave', endDrag);

    const sun = new THREE.DirectionalLight(0xfff8ee, 4.0);
    sun.position.set(5, 1.5, 3);
    scene.add(sun);
    scene.add(new THREE.HemisphereLight(0x88aadd, 0x553322, 1.1));
    scene.add(new THREE.AmbientLight(0x556688, 1.0));

    const rim = new THREE.DirectionalLight(0x5588bb, 0.4);
    rim.position.set(-4, -1, -2);
    scene.add(rim);

    const baseURL = './assets/';
    const manager = new THREE.LoadingManager();
    manager.onLoad = () => document.getElementById('loader').classList.add('hide');
    manager.onError = (url) => console.warn('纹理加载失败:', url);
    setTimeout(() => document.getElementById('loader').classList.add('hide'), 8000);

    const loader = new THREE.TextureLoader(manager);
    const load = (name) => loader.load(baseURL + name);

    const dayMap = load('earth_day.jpg');
    const normalMap = load('earth_normal.jpg');
    const specularMap = load('earth_specular.jpg');
    const cloudsMap = load('earth_clouds.png');
    dayMap.colorSpace = THREE.SRGBColorSpace;

    const EARTH_RADIUS = 1;
    const earth = new THREE.Mesh(
      new THREE.SphereGeometry(EARTH_RADIUS, 96, 96),
      new THREE.MeshPhongMaterial({
        map: dayMap,
        normalMap,
        specularMap,
        specular: new THREE.Color(0x3a5a80),
        shininess: 22,
        normalScale: new THREE.Vector2(0.85, 0.85),
        emissiveMap: dayMap,
        emissive: new THREE.Color(0x112233),
        emissiveIntensity: 0.45
      })
    );
    scene.add(earth);

    const clouds = new THREE.Mesh(
      new THREE.SphereGeometry(EARTH_RADIUS * 1.012, 64, 64),
      new THREE.MeshPhongMaterial({
        map: cloudsMap,
        transparent: true,
        opacity: 0.65,
        depthWrite: false,
        blending: THREE.NormalBlending
      })
    );
    scene.add(clouds);

    const atmosphere = new THREE.Mesh(
      new THREE.SphereGeometry(EARTH_RADIUS * 1.18, 64, 64),
      new THREE.ShaderMaterial({
        uniforms: {
          glowColor: { value: new THREE.Color(0x4ea1ff) },
          coefficient: { value: 0.62 },
          power: { value: 2.6 }
        },
        vertexShader: `
          varying vec3 vNormal;
          varying vec3 vViewPos;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vViewPos = -mvPos.xyz;
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: `
          varying vec3 vNormal;
          varying vec3 vViewPos;
          uniform vec3 glowColor;
          uniform float coefficient;
          uniform float power;
          void main() {
            vec3 viewDir = normalize(vViewPos);
            float rim = pow(coefficient - dot(vNormal, viewDir), power);
            rim = clamp(rim, 0.0, 1.0);
            gl_FragColor = vec4(glowColor, rim);
          }
        `,
        blending: THREE.AdditiveBlending,
        side: THREE.BackSide,
        transparent: true,
        depthWrite: false
      })
    );
    scene.add(atmosphere);

    function makeStars(count = 4500) {
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const color = new THREE.Color();
      for (let i = 0; i < count; i++) {
        const r = 80 + Math.random() * 320;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = r * Math.cos(phi);
        const t = Math.random();
        if (t < 0.78) color.setHSL(0.6, 0.05, 0.85 + Math.random() * 0.15);
        else if (t < 0.9) color.setHSL(0.6, 0.4, 0.7);
        else color.setHSL(0.1, 0.5, 0.75);
        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      return new THREE.Points(
        geo,
        new THREE.PointsMaterial({
          size: 1.4,
          sizeAttenuation: true,
          vertexColors: true,
          transparent: true,
          opacity: 0.95,
          depthWrite: false
        })
      );
    }
    const stars = makeStars();
    scene.add(stars);

    const satelliteRoot = new THREE.Group();
    scene.add(satelliteRoot);

    const constellationConfigs = {
      gps: {
        name: 'GPS',
        description: 'GPS 是美国建设的中轨导航星座，典型星座由多条倾斜轨道组成，为地面、航空和海上设备提供连续定位与授时。',
        altitudeLabel: '约 20,200 km',
        inclinationLabel: '55°',
        color: 0x5ec8ff,
        satelliteCount: 31,
        radius: 1.72,
        planes: 6,
        perPlane: 4,
        inclination: 55,
        speed: 0.18,
        phase: 0.2
      },
      starlink: {
        name: 'Starlink',
        description: 'Starlink 是低轨宽带通信星座，轨道高度更低、卫星数量更多，适合表现密集、快速掠过地球表面的网络覆盖。',
        altitudeLabel: '约 550 km',
        inclinationLabel: '53°',
        color: 0xf6c75e,
        satelliteCount: 10413,
        radius: 1.18,
        planes: 12,
        perPlane: 8,
        inclination: 53,
        speed: 0.42,
        phase: 1.1
      },
      beidou: {
        name: '北斗',
        description: '北斗是中国自主建设的全球卫星导航系统，包含中圆轨道、倾斜地球同步轨道与地球静止轨道，星座结构更混合。',
        altitudeLabel: '约 21,500 km',
        inclinationLabel: '55° / GEO',
        color: 0x69e49a,
        satelliteCount: 35,
        radius: 1.95,
        planes: 5,
        perPlane: 6,
        inclination: 55,
        speed: 0.14,
        phase: 2.4,
        geostationary: 5
      },
      qianfan: {
        name: '千帆星座',
        description: '千帆星座是中国商用遥感与通信的低轨星座，轨道更倾斜，适合展现高覆盖、高重访率的现代遥感部署。',
        altitudeLabel: '约 520 km',
        inclinationLabel: '97°',
        color: 0x8f6bff,
        satelliteCount: 126,
        radius: 1.22,
        planes: 8,
        perPlane: 3,
        inclination: 97,
        speed: 0.38,
        phase: 0.9
      },
      apt: {
        name: '亚太卫星',
        description: '亚太卫星代表的卫星星座以地球同步通信卫星为主，贴近赤道的长时间驻留轨道适合提供稳定的亚太区域广播与数据服务。',
        altitudeLabel: '约 35,786 km',
        inclinationLabel: '0° GEO',
        color: 0xff7bba,
        satelliteCount: 6,
        radius: 1.62,
        planes: 1,
        perPlane: 0,
        inclination: 0,
        speed: 0.03,
        phase: 0.6,
        geostationary: 5
      },
      jilin: {
        name: '吉林一号',
        description: '吉林一号是中国高分辨率遥感星座，采用太阳同步低轨道，常用于农业、城市与环境监测数据采集。',
        altitudeLabel: '约 528 km',
        inclinationLabel: '97.4°',
        color: 0x56d985,
        satelliteCount: 131,
        radius: 1.24,
        planes: 6,
        perPlane: 3,
        inclination: 97.4,
        speed: 0.39,
        phase: 1.4
      }
    };

    function makeOrbitLine(radius, color, opacity = 0.42) {
      const points = [];
      const segments = 192;
      for (let i = 0; i <= segments; i++) {
        const a = (i / segments) * Math.PI * 2;
        points.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
      }
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const mat = new THREE.LineBasicMaterial({
        color,
        transparent: true,
        opacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      return new THREE.LineLoop(geo, mat);
    }

    function makeSatellite(color) {
      return new THREE.Mesh(
        new THREE.SphereGeometry(0.012, 12, 12),
        new THREE.MeshBasicMaterial({ color })
      );
    }

    function makeConstellation(key, config) {
      const group = new THREE.Group();
      const satellites = [];
      const planeTilt = THREE.MathUtils.degToRad(config.inclination);

      for (let plane = 0; plane < config.planes; plane++) {
        const planeGroup = new THREE.Group();
        const raan = (plane / config.planes) * Math.PI * 2;
        planeGroup.rotation.y = raan;
        planeGroup.rotation.z = planeTilt;

        const orbit = makeOrbitLine(config.radius, config.color, key === 'starlink' ? 0.22 : 0.36);
        planeGroup.add(orbit);

        for (let slot = 0; slot < config.perPlane; slot++) {
          const sat = makeSatellite(config.color);
          sat.userData = {
            radius: config.radius,
            angle: (slot / config.perPlane) * Math.PI * 2 + (plane % 2) * 0.35 + config.phase,
            speed: config.speed * (0.92 + (slot % 3) * 0.05),
            planeGroup
          };
          planeGroup.add(sat);
          satellites.push(sat);
        }
        group.add(planeGroup);
      }

      for (let i = 0; i < (config.geostationary || 0); i++) {
        const planeGroup = new THREE.Group();
        planeGroup.rotation.y = (i / config.geostationary) * Math.PI * 2;
        const orbit = makeOrbitLine(1.62, config.color, 0.2);
        planeGroup.add(orbit);
        const sat = makeSatellite(config.color);
        sat.scale.setScalar(1.25);
        sat.userData = {
          radius: 1.62,
          angle: (i / config.geostationary) * Math.PI * 2,
          speed: 0.025,
          planeGroup
        };
        planeGroup.add(sat);
        satellites.push(sat);
        group.add(planeGroup);
      }

      satelliteRoot.add(group);
      return { group, satellites, visible: true };
    }

    const constellations = Object.fromEntries(
      Object.entries(constellationConfigs).map(([key, config]) => [key, makeConstellation(key, config)])
    );

    const infoPanel = document.getElementById('info-panel');
    const infoTitle = document.getElementById('info-title');
    const infoDesc = document.getElementById('info-desc');
    const infoAltitude = document.getElementById('info-altitude');
    const infoInclination = document.getElementById('info-inclination');
    const infoCount = document.getElementById('info-count');
    const infoCollapse = document.getElementById('info-collapse');
    let currentInfoKey = 'gps';
    let infoCollapsed = false;

    function setInfoCard(key) {
      currentInfoKey = key;
      const config = constellationConfigs[key];
      const constellation = constellations[key];
      infoPanel.dataset.current = key;
      infoTitle.textContent = config.name;
      infoDesc.textContent = config.description;
      infoAltitude.textContent = config.altitudeLabel;
      infoInclination.textContent = config.inclinationLabel;
      infoCount.textContent = config.satelliteCount !== undefined ? `${config.satelliteCount.toLocaleString()} 颗` : '--';
      document.querySelectorAll('.info-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.info === key);
      });
    }

    function getVisibleConstellationKeys() {
      return Object.entries(constellations)
        .filter(([, item]) => item.visible)
        .map(([key]) => key);
    }

    function updateConstellationButtonStates() {
      document.querySelectorAll('.toggle-btn[data-constellation]').forEach(btn => {
        const key = btn.dataset.constellation;
        btn.classList.toggle('on', constellations[key].visible);
      });
    }

    function syncInfoPanel() {
      infoPanel.classList.remove('hidden');
      infoCollapsed = false;
      infoPanel.classList.remove('collapsed');
      infoCollapse.textContent = '−';
      infoCollapse.setAttribute('aria-label', '收起信息卡');
    }

    function showSingleConstellation(key) {
      Object.entries(constellations).forEach(([constKey, item]) => {
        const isSelected = constKey === key;
        item.visible = isSelected;
        item.group.visible = isSelected;
      });
      updateConstellationButtonStates();
      updateSatelliteCount();
    }

    function updateSatellitePositions(dt) {
      for (const constellation of Object.values(constellations)) {
        if (!constellation.visible) continue;
        for (const sat of constellation.satellites) {
          sat.userData.angle += dt * sat.userData.speed;
          const a = sat.userData.angle;
          sat.position.set(Math.cos(a) * sat.userData.radius, 0, Math.sin(a) * sat.userData.radius);
        }
      }
    }

    function updateSatelliteCount() {
      const total = Object.entries(constellations)
        .filter(([, item]) => item.visible)
        .reduce((sum, [key]) => sum + constellationConfigs[key].satelliteCount, 0);
      document.getElementById('sat-count').textContent = total.toString();
    }

    const state = {
      autoRotate: true,
      clouds: true,
      atmosphere: true,
      stars: true
    };

    let userInteracting = false;
    controls.addEventListener('start', () => { userInteracting = true; });
    controls.addEventListener('end', () => { userInteracting = false; });

    document.querySelectorAll('.toggle-btn[data-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.toggle;
        state[key] = !state[key];
        btn.classList.toggle('on', state[key]);
        if (key === 'clouds') clouds.visible = state[key];
        if (key === 'atmosphere') atmosphere.visible = state[key];
        if (key === 'stars') stars.visible = state[key];
      });
    });

    document.querySelectorAll('.toggle-btn[data-constellation]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.constellation;
        const item = constellations[key];
        item.visible = !item.visible;
        item.group.visible = item.visible;
        btn.classList.toggle('on', item.visible);
        updateSatelliteCount();
      });
    });

    document.querySelectorAll('.info-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const key = tab.dataset.info;
        setInfoCard(key);
        showSingleConstellation(key);
      });
    });

    infoCollapse.addEventListener('click', () => {
      infoCollapsed = !infoCollapsed;
      infoPanel.classList.toggle('collapsed', infoCollapsed);
      infoCollapse.textContent = infoCollapsed ? '+' : '−';
      infoCollapse.setAttribute('aria-label', infoCollapsed ? '展开信息卡' : '收起信息卡');
    });

    // Enable drag-to-scroll for the right toggle panel (so users can drag anywhere
    // on the panel to scroll, instead of using the scrollbar).
    (function enablePanelDragScroll() {
      const togglePanel = document.getElementById('toggle-panel');
      if (!togglePanel) return;

      let drag = {
        active: false,
        pointerId: null,
        lastX: 0,
        lastY: 0,
        dragging: false,
        moved: false
      };

      togglePanel.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        if (e.target.closest('button, a, input, select, textarea, label')) return;
        drag.active = true;
        drag.pointerId = e.pointerId;
        drag.lastX = e.clientX;
        drag.lastY = e.clientY;
        drag.dragging = false;
        drag.moved = false;
        togglePanel.setPointerCapture(e.pointerId);
      });

      togglePanel.addEventListener('pointermove', (e) => {
        if (!drag.active || e.pointerId !== drag.pointerId) return;
        const dx = e.clientX - drag.lastX;
        const dy = e.clientY - drag.lastY;
        const distance = Math.abs(dx) + Math.abs(dy);
        if (!drag.dragging && distance < 6) return;
        const delta = getLogicalPointerDelta(dx, dy);
        togglePanel.scrollTop -= delta.dy;
        drag.lastX = e.clientX;
        drag.lastY = e.clientY;
        drag.dragging = true;
        drag.moved = true;
        togglePanel.style.userSelect = 'none';
      });

      function endDrag(e) {
        if (!drag.active || e.pointerId !== drag.pointerId) return;
        drag.active = false;
        try { togglePanel.releasePointerCapture(e.pointerId); } catch (err) {}
        drag.pointerId = null;
        drag.dragging = false;
        togglePanel.style.userSelect = '';
      }

      togglePanel.addEventListener('pointerup', endDrag);
      togglePanel.addEventListener('pointercancel', endDrag);
      togglePanel.addEventListener('pointerleave', endDrag);
    })();

    function onResize() {
      applyLandscapeLayout();
      camera.aspect = viewport.width / viewport.height;
      camera.updateProjectionMatrix();
      renderer.setSize(viewport.width, viewport.height);
    }
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', () => setTimeout(onResize, 300));

    const clock = new THREE.Clock();
    const distEl = document.getElementById('dist');
    updateSatelliteCount();
    setInfoCard(currentInfoKey);
    syncInfoPanel();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      if (state.autoRotate && !userInteracting) {
        earth.rotation.y += dt * 0.06;
        satelliteRoot.rotation.y += dt * 0.06;
      }
      if (state.clouds) clouds.rotation.y += dt * 0.075;
      stars.rotation.y += dt * 0.003;
      updateSatellitePositions(dt);

      controls.update();
      distEl.textContent = camera.position.length().toFixed(2);
      renderer.render(scene, camera);
    }

    animate();
  </script>

  <script>
    // 返回处理：优先使用 history.back()（若有 referrer），若未返回则降级到入口页
    window.handleBack = function (e) {
      e = e || window.event;
      if (e && e.preventDefault) e.preventDefault();
      const fallback = '../MapPortal/index.html';
      try {
        if (document.referrer) {
          history.back();
          // 若 history.back 无效（例如没有上一页），5 百毫秒后跳转到入口页
          setTimeout(() => { location.href = fallback; }, 500);
          return;
        }
        if (history.length > 1) {
          history.back();
          setTimeout(() => { location.href = fallback; }, 500);
          return;
        }
      } catch (err) {
        // ignore and fallback
      }
      location.href = fallback;
    };
  </script>
